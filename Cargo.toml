[workspace]
members = [ "crates/core", "crates/cli", "src-tauri" ]
resolver = "2"

  [workspace.package]
  version = "0.1.2"
  edition = "2021"
  license = "MIT"
  repository = "https://github.com/Akylas/cairn"
  homepage = "https://akylas.github.io/cairn"
  authors = [ "Martin Guillon and Cairn contributors" ]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# `tauri dev` builds without optimisation, and the terrain render is a hot loop over millions of
# pixels that calls into libwebp, an image decoder and SQLite: unoptimised, the same build runs
# an order of magnitude slower. The dependencies are optimised once and cached, and the pipeline
# crate gets enough to be usable; the app shell stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.cairn-core]
opt-level = 2
